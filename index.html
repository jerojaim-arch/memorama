<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="Juego de memorama instalable (PWA).">
  <title>Memorama</title>

  <!-- Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Iconos y CSS -->
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <h1>Memorama</h1>

  <p class="marcador">
    Tiempo: <span id="timer">00:00</span> | Mejor: <span id="bestTime">--:--</span>
  </p>
  <p class="marcador">Intentos: <span id="moves">0</span> | Pares: <span id="pairs">0</span>/8</p>

  <div class="grid" id="gameBoard" aria-label="Tablero del memorama"></div>

  <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

  <div class="acciones">
    <button id="btnRestart" class="boton">Reiniciar</button>
    <!-- Botón de instalación manual -->
    <button id="btnInstall" class="boton boton-instalar" style="display: none;">Instalar App</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
